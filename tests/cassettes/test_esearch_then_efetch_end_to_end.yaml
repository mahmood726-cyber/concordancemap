      string: "<?xml version=\"1.0\" ?>\n<!DOCTYPE PubmedArticleSet PUBLIC \"-//NLM//DTD
        PubMedArticle, 1st January 2025//EN\" \"https://dtd.nlm.nih.gov/ncbi/pubmed/out/pubmed_250101.dtd\">\n<PubmedArticleSet>\n<PubmedArticle><MedlineCitation
        Status=\"Publisher\" Owner=\"NLM\"><PMID Version=\"1\">41968841</PMID><DateRevised><Year>2026</Year><Month>04</Month><Day>13</Day></DateRevised><Article
        PubModel=\"Print-Electronic\"><Journal><ISSN IssnType=\"Electronic\">1875-6557</ISSN><JournalIssue
        CitedMedium=\"Internet\"><PubDate><Year>2026</Year><Month>Apr</Month><Day>09</Day></PubDate></JournalIssue><Title>Current
        cardiology reviews</Title><ISOAbbreviation>Curr Cardiol Rev</ISOAbbreviation></Journal><ArticleTitle>Cost-Effectiveness
        of Empagliflozin in Patients with Chronic Heart Failure and Chronic Kidney
        Disease: A Systematic Review.</ArticleTitle><ELocationID EIdType=\"doi\" ValidYN=\"Y\">10.2174/011573403X403324251130140853</ELocationID><Abstract><AbstractText
        Label=\"INTRODUCTION\" NlmCategory=\"BACKGROUND\">To evaluate the cost-effectiveness
        of empagliflozin in patients with chronic heart failure with preserved ejection
        fraction (CHFpEF) and moderately reduced ejection fraction (CHFmrEF) across
        various healthcare systems.</AbstractText><AbstractText Label=\"MATERIALS
        AND METHODS\" NlmCategory=\"METHODS\">A systematic review was conducted according
        to PRISMA 2024 guidelines. A total of 6 studies were included after screening
        225 records from PubMed, Web of Science, ScienceDirect, and Google Scholar.
        Studies evaluating cost-effectiveness outcomes, including incremental cost-effectiveness
        ratios (ICER), quality-adjusted life years (QALY), and healthcare costs, were
        analyzed.</AbstractText><AbstractText Label=\"RESULTS\" NlmCategory=\"RESULTS\">All
        included studies applied a Markov model over a 10-year time horizon. Empagliflozin
        was associated with a 15-18% reduction in hospitalizations, an increase in
        QALYs by 0.11-0.67, and ICERs ranging from &#x20ac;5,089/QALY to $174,053/QALY,
        depending on the healthcare setting and model assumptions. Examples include:
        Spain: &#x20ac;5,089/QALY, China: $11,292/QALY, USA: $25,974-$174,053/QALY,
        Australia: A$29,202/QALY. ICER per life year (LY) ranged from $6,246 to $151,929,
        indicating variable cost-effectiveness based on country-specific cost structures
        and thresholds.</AbstractText><AbstractText Label=\"CONCLUSIONS\" NlmCategory=\"CONCLUSIONS\">Empagliflozin
        appears to be a cost-effective add-on therapy to standard care for CHFpEF
        and CHFmrEF, especially in healthcare systems with high hospitalization costs.
        However, its value is highly sensitive to drug pricing and national willingness-to-pay
        thresholds. Further real-world studies are needed to confirm long-term economic
        benefits. The review was registered with PROSPERO (CRD420250654439). Available
        from: https://www.crd.york.ac.uk/PROSPERO/view/CRD420250654439.</AbstractText><CopyrightInformation>Copyright&#xa9;
        Bentham Science Publishers; For any queries, please email at epub@benthamscience.net.</CopyrightInformation></Abstract><AuthorList
