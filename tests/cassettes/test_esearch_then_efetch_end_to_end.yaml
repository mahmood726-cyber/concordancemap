        PubModel=\"Electronic-eCollection\"><Journal><ISSN IssnType=\"Print\">1664-2392</ISSN><JournalIssue
        CitedMedium=\"Print\"><Volume>16</Volume><PubDate><Year>2025</Year></PubDate></JournalIssue><Title>Frontiers
        in endocrinology</Title><ISOAbbreviation>Front Endocrinol (Lausanne)</ISOAbbreviation></Journal><ArticleTitle>Comparative
        efficacy and safety of different SGLT2 inhibitor-based combination strategies
        in HFrEF: a systematic review and network meta-analysis.</ArticleTitle><Pagination><StartPage>1742128</StartPage><MedlinePgn>1742128</MedlinePgn></Pagination><ELocationID
        EIdType=\"pii\" ValidYN=\"Y\">1742128</ELocationID><ELocationID EIdType=\"doi\"
        ValidYN=\"Y\">10.3389/fendo.2025.1742128</ELocationID><Abstract><AbstractText
        Label=\"BACKGROUND\" NlmCategory=\"UNASSIGNED\">The optimal combination therapy
        for heart failure with reduced ejection fraction (HFrEF) involving sodium-glucose
        transporter 2 inhibitors (SGLT2i), angiotensin receptor-neprilysin inhibitors
        (ARNI), and conventional triple therapy remains uncertain due to the lack
        of direct comparative evidence.</AbstractText><AbstractText Label=\"METHODS\"
        NlmCategory=\"UNASSIGNED\">We conducted a Bayesian network meta-analysis of
        randomized controlled trials (RCTs) comparing six treatment regimens. Primary
        outcome was the composite of cardiovascular death and hospitalization. Secondary
        outcomes included all-cause mortality, Kansas City Cardiomyopathy Questionnaire
        (KCCQ) scores, 6-minute walk distance (6MWD), N-terminal pro-B-type natriuretic
        peptide (NT-proBNP) levels, and adverse events (hypotension, hyperkalemia,
        renal events). All analyses were performed under a Bayesian statistical framework,
        and the relative efficacy and safety of the six regimens were ranked using
        surface under the cumulative ranking curve (SUCRA) probabilities.</AbstractText><AbstractText
        Label=\"RESULTS\" NlmCategory=\"UNASSIGNED\">A total of 22 studies (21 RCTs)
        involving 24,499 patients were included. For the primary composite outcome,
        Sotagliflozin-based quadruple therapy ranked first (SUCRA: 90.8%; OR: 0.49,
        95%CI: 0.16 to 1.47). Dapagliflozin+triple therapy (SUCRA: 76.8%; OR: 0.83,
        95%CI: 0.69 to 0.98) and ARNI+BB+MRA (SUCRA: 76.6%; OR: 0.83, 95%CI: 0.75
        to 0.92) demonstrated significant reductions in all-cause mortality. ARNI-based
        triple therapy was associated with a significantly increased risk of hypotension
        (OR: 1.67, 95%CI: 1.48 to 1.90), whereas Dapagliflozin and Empagliflozin showed
        protective effects against renal adverse events. No regimen significantly
        increased hyperkalemia risk. Additionally, a statistically significant interaction
        was observed between treatment effects and baseline diabetes burden for the
        primary outcome (<i>p</i> = 0.003).</AbstractText><AbstractText Label=\"CONCLUSIONS\"
        NlmCategory=\"UNASSIGNED\">This network meta-analysis demonstrates that while
        all quadruple therapy regimens improve outcomes in HFrEF, important distinctions
        exist. Sotagliflozin-based therapy may offer advantages in preventing hospitalizations,
        whereas Dapagliflozin and ARNI are comparable for mortality reduction. The
        safety profiles differ significantly, particularly regarding hypotension risk
        with ARNI and renal protection with SGLT2i. The choice of regimen should be
        individualized based on patient priorities, comorbidities, and safety tolerability
        profiles.</AbstractText><AbstractText Label=\"SYSTEMATIC REVIEW REGISTRATION\"
        NlmCategory=\"UNASSIGNED\">https://www.crd.york.ac.uk/PROSPERO/view/CRD420251112344
        , identifier CRD420251112344.</AbstractText><CopyrightInformation>Copyright
